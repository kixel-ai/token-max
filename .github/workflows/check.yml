name: Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and package
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
      - name: Check sources and clean packed consumers
        run: nix develop --command quest gate just check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: .tmp/package/
          include-hidden-files: true
          if-no-files-found: error

  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node }}, Bun 1.4.4)
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: .tmp/package
      - name: Exercise the exact tarball with npx and Bun without Node
        run: node scripts/test-package.mjs

  check:
    name: Check
    needs: [source, package]
    # Draft source jobs are skipped, so fail this gate until real validation passes.
    # A prior skipped Check must not satisfy protection while a ready run is pending.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and every package matrix cell
        env:
          SOURCE: ${{ needs.source.result }}
          PACKAGE: ${{ needs.package.result }}
        run: test "$SOURCE" = success && test "$PACKAGE" = success

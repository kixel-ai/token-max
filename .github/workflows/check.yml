name: Check

permissions:
  contents: read

# No push trigger: main moves only to commits the merge queue already tested.
# No `edited`: a body or base edit changes no code, and the queue tests every
# entry against the current base anyway.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue tests each entry against the current base before it lands.
  merge_group:
  workflow_call:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A fresh runner reuses no incremental state, and no one attaches a debugger to
# a CI test. Full debug info made the test binaries 3.6 times larger, which the
# build writes and links and each `--ssh` test copies and hashes.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Read the draft state when the run starts, not from the event payload: a run
  # created out of order can still carry draft: true after the PR is ready, and
  # GitHub judges the PR by its newest run, so it must validate a PR ready now.
  # A change only to quests and agent docs cannot affect the Rust build or tests,
  # so it runs `quest check` alone. The compare API lists at most 300 files, so a
  # longer list builds everything. A release has no base and builds everything.
  state:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      draft: ${{ steps.read.outputs.draft }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          draft=false
          if [ "$EVENT" = pull_request ]; then
            draft=$(gh api "repos/$REPO/pulls/$PR" --jq .draft)
          fi
          build=true
          if [ -n "$BASE" ]; then
            # A rename counts its old path too, so moving code into quest/ still builds.
            build=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files
              | if length < 300 and ([.[] | .filename, (.previous_filename // empty)]
                  | all(test("^(quest/|(AGENTS|CLAUDE|CONTRIBUTING)\\.md$)")))
                then "false" else "true" end')
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  source:
    name: Source
    needs: state
    if: needs.state.outputs.draft == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Check formatting, lints, tests and quests
        if: needs.state.outputs.build == 'true'
        run: nix develop --command quest gate just check
      - name: Check quests
        if: needs.state.outputs.build == 'false'
        run: nix run .#quest -- check

  # macOS runs here only for a release; on main it runs after each merge
  # (macos.yml), since it never failed where Linux passed and its shared
  # runners held the gate up to an hour.
  platform:
    name: Tests (${{ matrix.os }})
    needs: state
    if: needs.state.outputs.draft == 'false' && needs.state.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # A called workflow sees its caller's event, so a release reads as neither.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["windows-2025"]' || '["windows-2025", "macos-15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update the preinstalled stable toolchain
        run: rustup update stable --no-self-update
      - name: Run the tests
        # Clippy runs only on Linux, so this catches code another platform leaves unused.
        env:
          RUSTFLAGS: -D warnings
        run: cargo +stable test --locked

  check:
    name: Check
    needs: [state, source, platform]
    # Draft jobs are skipped, so fail this gate until real validation passes.
    # A prior skipped Check must not satisfy protection while a ready run is pending.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require source, and every platform unless only quests changed
        env:
          BUILD: ${{ needs.state.outputs.build }}
          SOURCE: ${{ needs.source.result }}
          PLATFORM: ${{ needs.platform.result }}
        run: |
          test "$SOURCE" = success
          case "$BUILD" in
            true) test "$PLATFORM" = success ;;
            false) test "$PLATFORM" = skipped ;;
            *) exit 1 ;;
          esac

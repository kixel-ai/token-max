name: Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # The merge queue tests each entry against the current base before it lands.
  merge_group:
  workflow_call:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Read the draft state when the run starts, not from the event payload. A body
  # edit made just before marking ready can create its run after the
  # ready_for_review run, cancel it, and still carry draft: true. GitHub then
  # judges the PR by that newest run, so it must validate a PR that is ready now.
  state:
    name: Draft state
    runs-on: ubuntu-24.04
    outputs:
      draft: ${{ steps.read.outputs.draft }}
    steps:
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          draft=false
          if [ "$EVENT" = pull_request ]; then
            draft=$(gh api "repos/$REPO/pulls/$PR" --jq .draft)
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  source:
    name: Source
    needs: state
    if: needs.state.outputs.draft == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
      - name: Check formatting, lints, tests and quests
        run: nix develop --command quest gate just check

  platform:
    name: Tests (${{ matrix.os }})
    needs: state
    if: needs.state.outputs.draft == 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update the preinstalled stable toolchain
        run: rustup update stable --no-self-update
      - name: Run the tests
        run: cargo +stable test --locked

  check:
    name: Check
    needs: [source, platform]
    # Draft jobs are skipped, so fail this gate until real validation passes.
    # A prior skipped Check must not satisfy protection while a ready run is pending.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require source and every platform
        env:
          SOURCE: ${{ needs.source.result }}
          PLATFORM: ${{ needs.platform.result }}
        run: test "$SOURCE" = success && test "$PLATFORM" = success

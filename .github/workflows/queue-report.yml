name: Queue report

# The main ruleset requires no check until Kixel Quest's queue takes token-max,
# so the merge queue lands without waiting on Check, and GitHub tells no one when
# a run the queue's bot triggered fails. This files an issue instead. It lives
# apart from Check because Release calls Check with read-only permissions, which
# a nested job asking to write issues would exceed. It runs no repository code.
on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: Report
    if: github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          title="Check fails in the merge queue"
          body="Check failed on merge group $SHA: $RUN"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

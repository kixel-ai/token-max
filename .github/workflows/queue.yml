name: Queue

permissions:
  contents: read

# The skipped PR job satisfies admission; only the merge group tests the tree
# that GitHub will squash into main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  queue:
    name: Queue
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false

      - run: nix develop --command just check

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The Cargo.toml version being released
        required: true
        type: string
      authentication:
        description: Trusted publishing, or a token for the first release (crates.io requires the crate to exist first)
        required: true
        type: choice
        default: trusted
        options: [trusted, bootstrap]

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.repository == 'kixel-ai/token-max'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the requested version in Cargo.toml
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$version" = "$RELEASE_VERSION"
          test "$version" != 0.0.0

  validate:
    needs: preflight
    uses: ./.github/workflows/check.yml

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate with crates.io trusted publishing
        if: inputs.authentication == 'trusted'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the validated commit
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.authentication == 'trusted' && steps.auth.outputs.token || secrets.CARGO_BOOTSTRAP_TOKEN }}
        run: cargo publish --locked

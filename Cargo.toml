[package]
name = "token-max"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "Recommends cheaper agent settings from your Claude Code and Codex transcripts"
license = "MIT"
repository = "https://github.com/kixelated/token-max"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = "0.2.40"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
ureq = "3.5.1"

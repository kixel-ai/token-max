[package]
name = "token-max"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "Recommends cheaper agent settings from your Claude Code and Codex transcripts"
license = "MIT"
repository = "https://github.com/kixelated/token-max"
readme = "README.md"
keywords = ["claude", "codex", "cost", "cache", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/tests", "/test/fixtures", "/docs/semantics.md", "/README.md", "/LICENSE"]

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
foldhash = "0.2.0"
indexmap = { version = "2.14.2", features = ["serde"] }
rusqlite = { version = "0.41.1", features = ["bundled", "limits"] }
jiff = "0.2.40"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order", "raw_value"] }
sha2 = "0.11.1"
terminal_size = "0.4.4"
thiserror = "2.0.21"
toml = "1.2.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
ureq = "3.5.1"
mimalloc = "0.1.52"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
winapi-util = "0.1.11"

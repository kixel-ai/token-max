[package]
name = "token-max"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
description = "Recommends cheaper agent settings from your Claude Code and Codex transcripts"
license = "MIT"
repository = "https://github.com/kixel-ai/token-max"
readme = "README.md"
keywords = ["claude", "codex", "cost", "cache", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/skills/token-audit/SKILL.md", "/tests", "/test/fixtures", "/site/public/run.sh", "/site/public/run.ps1", "/docs/semantics.md", "/README.md", "/LICENSE"]

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
ctrlc = { version = "3.5.3", features = ["termination"] }
foldhash = "0.2.0"
indexmap = { version = "2.14.2", features = ["serde"] }
rusqlite = { version = "0.43.0", features = ["bundled", "limits"] }
jiff = "1.0.3"
jsonc-parser = { version = "0.34.0", default-features = false, features = ["cst", "serde"] }
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
similar = "3.2.1"
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order", "raw_value"] }
sha2 = "0.11.2"
terminal_size = "0.4.4"
toml = "1.2.3"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
ureq = "3.5.2"
mimalloc = "0.1.52"
toml_edit = { version = "0.25.21", default-features = false, features = ["parse", "display"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
winapi-util = "0.1.11"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

# Its binary is also the fake `ssh.exe` it runs, which libtest's argument parsing would reject.
[[test]]
name = "ssh_windows"
harness = false

# Its binary is also the release doctor upgrades to, run with doctor's arguments.
[[test]]
name = "upgrade_windows"
harness = false

# The profile cargo-dist builds release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"

# `--ssh` hashes its own binary on every run, which an unoptimized sha2 makes the
# slowest part of the test suite.
[profile.dev.package.sha2]
opt-level = 3

# Where `cargo binstall` finds the archives cargo-dist attaches to each release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

# A suppression says why it is needed, and `expect` fails once it no longer is.
[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
